<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TMJ Segmentation Quick Check</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      }
      main {
        padding: 24px;
        display: grid;
        gap: 24px;
      }
      section {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.45);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.04em;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      canvas {
        width: 100%;
        height: auto;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(2, 6, 23, 0.8);
      }
      .meta {
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.4;
        color: #94a3b8;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .overlay {
        position: relative;
      }
      .overlay canvas {
        position: absolute;
        inset: 0;
      }
      .overlay picture {
        display: block;
      }
      .overlay img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
      }
      .viewer {
        position: relative;
        display: grid;
        gap: 12px;
      }
      .layer {
        position: relative;
        width: 100%;
        overflow: hidden;
      }
      .figure {
        position: relative;
      }
      .canvas-wrapper {
        position: relative;
        width: min(680px, 100%);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TMJ Segmentation Quick Check</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #94a3b8">
        wasm/pkg を直接利用する簡易ビューア。Chrome DevTools で condyle/fossa
        の抽出結果を確認できます。
      </p>
    </header>
    <main id="root"></main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
