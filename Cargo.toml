[package]
name = "tmj_diagnosis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
image = "0.25"
imageproc = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
